name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app || ls /Applications | grep Xcode
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test (macOS)
        run: |
          xcodebuild -project Raconte.xcodeproj -scheme Raconte \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            test
      - name: UI tests (iOS simulator)
        run: |
          xcodebuild -project Raconte.xcodeproj -scheme RaconteUI \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            test
