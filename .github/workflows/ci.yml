name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes an in-flight run on the same ref cancels it — without
# this, every amend to a PR left the previous ~30-minute run burning a macOS
# runner to completion. Runs on main are never cancelled: every main commit
# keeps its full, uninterrupted run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: Unit tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      # Pinned release binary instead of `brew install xcodegen`: no brew
      # metadata churn, a fixed version, and a checksum so a tampered or
      # truncated download fails loudly instead of generating a wrong project.
      # Bumping XcodeGen = update the version in the URL AND the sha256 below
      # (shasum -a 256 xcodegen.zip). The zip ships xcodegen/bin/xcodegen with
      # its SettingPresets under xcodegen/share, so it must run from the
      # unzipped tree, not be copied out alone.
      - name: Install XcodeGen 2.46.0 (pinned, checksummed)
        run: |
          curl -sSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
      - name: Generate project
        run: /tmp/xcodegen-dist/xcodegen/bin/xcodegen generate
      # CODE_SIGN_ENTITLEMENTS override (M4 T4): `com.apple.developer.icloud-*` are
      # restricted entitlements, so macOS refuses to ad-hoc-sign a binary carrying them
      # ("has entitlements that require signing with a development certificate") and a
      # runner has no development profile to fetch. The override drops exactly those
      # keys and keeps the sandbox — which must stay, because RaconteTests runs with the
      # real app as its host: unsandboxed, `AppContainer.root()` is a real home
      # directory rather than a container. `EntitlementsParityTests` pins the two files
      # against each other so the override can't silently lose a capability.
      - name: Build and test (macOS)
        run: |
          xcodebuild -project Raconte.xcodeproj -scheme Raconte \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults/unit.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=Raconte/Raconte-nocloud.entitlements \
            test
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: TestResults
          if-no-files-found: ignore

  # Split from the unit job so the two cold Xcode builds run on two runners in
  # parallel instead of back-to-back — wall-clock roughly halves. No
  # entitlements override here: simulator builds don't validate restricted
  # entitlements against a profile (verified 2026-08-17).
  ui:
    name: UI tests (iOS simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen 2.46.0 (pinned, checksummed)
        run: |
          curl -sSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
      - name: Generate project
        run: /tmp/xcodegen-dist/xcodegen/bin/xcodegen generate
      - name: UI tests (iOS simulator)
        run: |
          xcodebuild -project Raconte.xcodeproj -scheme RaconteUI \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath TestResults/ui.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            test
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ui
          path: TestResults
          if-no-files-found: ignore
