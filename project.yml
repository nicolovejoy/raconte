name: Raconte
options:
  bundleIdPrefix: org.pianohouseproject
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8UK463WB83
schemes:
  Raconte:
    build:
      targets:
        Raconte: all
    test:
      targets: [RaconteTests]
  # UI tests live in their own scheme, NOT the default test action: on macOS they
  # need the interactive automation-mode permission, so they run against a
  # simulator (CI runs this; locally:
  #   xcodebuild -project Raconte.xcodeproj -scheme RaconteUI \
  #     -destination 'platform=iOS Simulator,name=iPhone 17' test).
  RaconteUI:
    build:
      targets:
        Raconte: all
    test:
      targets: [RaconteUITests]
    run:
      config: Debug
targets:
  Raconte:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Raconte]
    info:
      path: Raconte/Info.plist
      properties:
        CFBundleDisplayName: Raconte
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Raconte records your spoken journal entries.
        NSCameraUsageDescription: Take a cover photo for a journal.
        # ⚠️ Info.plist is GENERATED from this list — any key edited only in
        # Raconte/Info.plist is silently deleted by the next `xcodegen generate`.
        # That bit us twice in one day (2026-08-24): the TestFlight build number
        # reset 2→1 mid-branch, and PR #93's export-compliance key vanished on the
        # next regen. Version-like keys live HERE, edited here, never in the plist.
        # Bump CFBundleVersion for every TestFlight upload (scripts/upload_testflight.sh).
        CFBundleVersion: "13"
        # ASC stops asking the export-compliance question per upload (PR #93).
        # Standard iOS crypto only (HTTPS/CloudKit), no proprietary encryption.
        ITSAppUsesNonExemptEncryption: false
        # The Mac App Store leg REJECTS a .pkg without this (ASC error 90242, hit on
        # the build-8 upload 2026-08-26; iOS does not require it). Lives HERE, not in
        # Info.plist, for the same never-edit-the-generated-plist reason as the keys
        # above — a plist-only fix is wiped by the next `xcodegen generate`, which is
        # the likely story of how it was present for build 6 and gone by build 8.
        LSApplicationCategoryType: public.app-category.lifestyle
        # Defensive (design §6). Measured on the iPhone 17 Pro 2026-08-02: iOS does NOT
        # prompt for this with on-device SpeechAnalyzer — only the mic prompt appeared.
        # Kept so a future cloud/dictation path can't turn into a launch crash.
        NSSpeechRecognitionUsageDescription: Raconte transcribes your entries on this device.
        # `audio` keeps a capture alive when the app backgrounds (M1).
        # `remote-notification` (M4 design §8) lets CloudKit's silent push wake the app
        # so a change made on another device lands without the owner opening this one.
        UIBackgroundModes: [audio, remote-notification]
        # TestFlight/App Store validation requires this key — its absence ("the app
        # declares no orientations") failed the upload. iPhone: portrait-only (the
        # capture screen has no rotated layout). iPad: all four, to keep multitasking
        # (Split View/Slide Over rotate the window regardless of the app's own intent).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Raconte/Raconte.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        # M4 sync (design §8). The container was reserved on the portal long ago; these
        # are the first entitlement keys that actually claim it. One entitlements file
        # serves both platforms here, which is why the macOS-only sandbox key above and
        # these shared iCloud keys sit together — iOS ignores the sandbox keys, macOS
        # honours all of them.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.pianohouseproject.raconte
        com.apple.developer.icloud-services: [CloudKit]
        # Development environment first (design §8): schema materializes from first
        # writes and is deployed to production before any TestFlight build.
        aps-environment: development
        # Required under the macOS sandbox for CloudKit to reach the network at all;
        # without it every sync call fails with a connection error on the Mac only.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pianohouseproject.raconte
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RaconteUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [RaconteUITests]
    dependencies:
      - target: Raconte
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RaconteTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [RaconteTests]
    dependencies:
      - target: Raconte
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Raconte.app/Contents/MacOS/Raconte
